# Render Blueprint: one native Python web service; no Docker is required.
# This reliable SQLite configuration uses paid compute and a paid 1 GB disk.
# Review Render's pricing before creating the service.
services:
  - type: web
    name: tickwise
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && exec python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: tickwise-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/tasks.sqlite3
      - key: SCHEDULER_ENABLED
        value: "true"
      # Render prompts for the value when creating the Blueprint; don't commit it.
      - key: API_KEY
        sync: false
