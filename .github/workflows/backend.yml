name: Integration

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Diagnose previous intermittent failure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/jobs/123527120332/logs" > "$RUNNER_TEMP/previous-job.log"
          python - "$RUNNER_TEMP/previous-job.log" <<'PYDIAG'
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors="replace")
          start = text.find("FAILURES")
          end = text.find("short test summary info", start)
          excerpt = text[start:end if end > start else None] if start >= 0 else text[-12000:]
          excerpt = excerpt[:40000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::warning title=Previous backend failure::" + excerpt)
          PYDIAG
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml="$RUNNER_TEMP/pytest.xml"
          result=$?
          if [ "$result" -ne 0 ] && [ -f "$RUNNER_TEMP/pytest.xml" ]; then
            python scripts/report_junit.py "$RUNNER_TEMP/pytest.xml"
          fi
          exit "$result"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the deployable image and persistent volume
        shell: bash
        run: |
          set -euo pipefail
          API_KEY=ci-container-key docker compose config >/dev/null
          docker build -f backend/Dockerfile -t tickwise:ci .
          docker volume create tickwise-ci-data >/dev/null
          cleanup() {
            docker logs tickwise-ci || true
            docker rm -f tickwise-ci >/dev/null 2>&1 || true
            docker volume rm tickwise-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          start_container() {
            docker run -d --name tickwise-ci -p 127.0.0.1:18000:8000 \
              -e API_KEY=ci-container-key -v tickwise-ci-data:/data tickwise:ci >/dev/null
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:18000/health >/dev/null; then return; fi
              sleep 1
            done
            echo 'Container did not become healthy' >&2
            return 1
          }
          start_container
          curl -fsS http://127.0.0.1:18000/ | grep -q Tickwise
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/api/v1/tasks)" = 401
          task_id=$(curl -fsS -H 'X-API-Key: ci-container-key' -H 'Content-Type: application/json' \
            -d '{"name":"Container smoke","action_type":"log","message":"container works","schedule":{"type":"interval","seconds":3600}}' \
            http://127.0.0.1:18000/api/v1/tasks | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST -H 'X-API-Key: ci-container-key' \
            "http://127.0.0.1:18000/api/v1/tasks/$task_id/runs" >/dev/null
          success=false
          for i in $(seq 1 30); do
            if curl -fsS -H 'X-API-Key: ci-container-key' \
              "http://127.0.0.1:18000/api/v1/tasks/$task_id/runs" | \
              python3 -c 'import json,sys; runs=json.load(sys.stdin); sys.exit(not (runs and runs[0]["status"] == "succeeded" and runs[0]["attempts"][0]["output"] == "container works"))'; then
              success=true
              break
            fi
            sleep 1
          done
          test "$success" = true
          docker rm -f tickwise-ci >/dev/null
          start_container
          curl -fsS -H 'X-API-Key: ci-container-key' \
            "http://127.0.0.1:18000/api/v1/tasks/$task_id" | \
            python3 -c 'import json,sys; assert json.load(sys.stdin)["name"] == "Container smoke"'
